<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var savedScheme = localStorage.getItem("color-scheme");
        if (savedScheme === "dark" || savedScheme === "light") {
          document.querySelector('meta[name="color-scheme"]').content = savedScheme;
          document.documentElement.setAttribute("data-theme", savedScheme);
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
